name: Browser smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "public/**"
      - "e2e/**"
      - "lib/aircraft-*.ts"
      - "lib/content-*.ts"
      - "lib/static-content-repository.ts"
      - "playwright.config.mjs"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/browser-smoke.yml"
  schedule:
    - cron: "43 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Desktop + mobile Chromium + iPad WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLYTALLY_TRAINING_BROWSER_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked application and browser-test dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Production build
        run: npm run build
      - name: Real browser smoke
        run: npx playwright test --config=playwright.config.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-browser-smoke-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
