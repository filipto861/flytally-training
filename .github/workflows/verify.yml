name: Verify Training

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Export reviewed M27 payloads
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types tooling/export-m27-payloads.ts
      - name: Upload reviewed M27 payloads
        uses: actions/upload-artifact@v4
        with:
          name: m27-content-payloads
          path: m27-payloads.json
          retention-days: 1
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
